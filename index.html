<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神主牌位排字工具</title>
    <style>
        :root {
            --wood-bg: linear-gradient(135deg, #d2a679 0%, #b37746 100%);
            --wood-border: #6b4423;
            --inner-bg: #cc0000;
            --text-dark: #222;
            --text-light: #f5f5f5;
        }

        body {
            font-family: "BiauKai", "DFKai-SB", "Kaiti", "標楷體", serif;
            margin: 0;
            padding: 20px;
            background-color: #f0ece1;
            color: #333;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            max-width: 1300px;
            margin: 0 auto;
        }

        /* 左側設定區 */
        .settings-panel {
            flex: 1;
            min-width: 350px;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-height: 90vh;
            overflow-y: auto;
        }

        h2 {
            border-bottom: 2px solid #b37746;
            padding-bottom: 10px;
            color: #6b4423;
            font-size: 1.4rem;
            margin-top: 0;
        }

        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
            font-size: 0.95rem;
        }

        input[type="text"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1rem;
            box-sizing: border-box;
            font-family: inherit;
        }

        .fortune-tag {
            font-size: 0.85rem;
            color: #d32f2f;
            margin-left: 10px;
            font-weight: normal;
        }

        .inner-person-block {
            background: #fafafa;
            border: 1px solid #eee;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #cc0000;
        }

        /* 右側預覽區 */
        .preview-panel {
            flex: 1;
            min-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .tabs {
            display: flex;
            gap: 10px;
        }

        .tab-btn {
            padding: 10px 20px;
            border: none;
            background: #ddd;
            cursor: pointer;
            border-radius: 5px 5px 0 0;
            font-size: 1rem;
            font-family: inherit;
            font-weight: bold;
            flex: 1;
        }

        .tab-btn.active {
            background: #b37746;
            color: #fff;
        }

        .preview-content {
            background: #fff;
            padding: 30px;
            border-radius: 0 10px 10px 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: none;
            justify-content: center;
            min-height: 600px;
        }

        .preview-content.active {
            display: flex;
        }

        /* 牌位視覺共用 */
        .tablet {
            writing-mode: vertical-rl;
            text-orientation: upright;
            padding: 30px 20px;
            box-shadow: 3px 6px 15px rgba(0,0,0,0.4);
            margin: 0 auto;
        }

        /* 外牌樣式 */
        .outer-tablet {
            width: 260px;
            height: 550px;
            background: var(--wood-bg);
            border: 8px solid var(--wood-border);
            border-radius: 20px 20px 0 0;
            color: var(--text-dark);
            position: relative;
            display: flex;
            align-items: center;
            outline: 2px solid rgba(0,0,0,0.3) inset;
            box-shadow: 5px 10px 20px rgba(0,0,0,0.3);
        }

        .tanghao {
            writing-mode: horizontal-tb;
            text-align: center;
            font-size: 1.6rem;
            font-weight: bold;
            margin-bottom: 20px;
            letter-spacing: 5px;
            width: 100%;
        }

        .tablet-body {
            display: flex;
            justify-content: space-between;
            width: 100%;
            height: 100%;
            padding: 0 10px;
            box-sizing: border-box;
        }

        .col-right, .col-left {
            font-size: 1.1rem;
            line-height: 1.5;
            padding-top: 50px;
            writing-mode: vertical-rl;
            text-orientation: upright;
        }

        .col-middle {
            font-size: 1.7rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-align: center;
            writing-mode: vertical-rl;
            text-orientation: upright;
        }

        /* 內牌樣式 */
        .inner-tablet {
            width: 260px;
            height: 550px;
            background: var(--inner-bg);
            border-radius: 10px;
            color: #000;
            padding: 30px 15px;
            display: flex;
            justify-content: center;
            gap: 15px;
            box-shadow: 3px 6px 15px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }

        .inner-person-col {
            display: flex;
            justify-content: space-between;
            height: 100%;
            border-right: 1px dashed rgba(0,0,0,0.2);
            padding-right: 15px;
        }
        .inner-person-col:first-child {
            border-right: none;
            padding-right: 0;
        }

        .inner-side {
            font-size: 0.95rem;
            padding-top: 30px;
            writing-mode: vertical-rl;
            text-orientation: upright;
        }
        
        .inner-main {
            font-size: 1.4rem;
            font-weight: bold;
            margin: 0 5px;
            writing-mode: vertical-rl;
            text-orientation: upright;
        }

        /* 純文字輸出區 */
        #text-output {
            width: 100%;
            height: 500px;
            padding: 20px;
            background: #fafafa;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: "Courier New", "標楷體", monospace;
            font-size: 1.1rem;
            line-height: 1.8;
            resize: vertical;
            box-sizing: border-box;
        }

        .btn-copy {
            background: #4CAF50;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1rem;
            margin-top: 15px;
            width: 100%;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-copy:hover {
            background: #45a049;
        }

        @media (max-width: 900px) {
            .container { flex-direction: column; }
            .settings-panel { max-height: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="settings-panel">
        <h2>管理資訊</h2>
        <div class="form-row">
            <div class="form-group">
                <label>牌位編號</label>
                <input type="text" id="tabletId" value="1F-01-03">
            </div>
            <div class="form-group">
                <label>入牌日期</label>
                <input type="text" id="entryDate" value="115.05.30">
            </div>
        </div>

        <h2>外牌設定</h2>
        <div class="form-row">
            <div class="form-group">
                <label>牌位類型</label>
                <select id="outerType">
                    <option value="ancestor">歷代祖先牌位</option>
                    <option value="male">個人牌位(男)</option>
                    <option value="female">個人牌位(女)</option>
                </select>
            </div>
            <div class="form-group">
                <label>姓氏</label>
                <input type="text" id="surname" value="陳">
            </div>
        </div>
        
        <div class="form-group">
            <label>堂號 (橫批) <span class="fortune-tag" id="ft-tanghao"></span></label>
            <input type="text" id="tanghao" value="穎　川">
            <small style="color:#777;">*視覺預覽將自動左右置換顯示</small>
        </div>
        <div class="form-group">
            <label>外牌主文 (中行) <span class="fortune-tag" id="ft-outermiddle"></span></label>
            <input type="text" id="outerMiddle" value="堂上陳姓歷代祖考妣之神位">
            <small style="color:#777;">*切換類型或姓氏時會自動產生</small>
        </div>
        <div class="form-group">
            <label>年份 (右行) <span class="fortune-tag" id="ft-year"></span></label>
            <input type="text" id="year" value="歲次甲辰年立">
        </div>
        <div class="form-group">
            <label>奉祀人 (左行) <span class="fortune-tag" id="ft-worship"></span></label>
            <input type="text" id="worship" value="陽上子孫奉祀">
        </div>

        <h2 style="margin-top:30px;">內牌設定</h2>
        <div class="form-group">
            <label>內牌形式</label>
            <select id="innerType">
                <option value="single">個人</option>
                <option value="couple">夫妻</option>
                <option value="trio">三人</option>
            </select>
        </div>
        
        <div id="inner-forms-container">
            </div>
    </div>

    <div class="preview-panel">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('tab-outer')">外牌視覺</button>
            <button class="tab-btn" onclick="switchTab('tab-inner')">內牌視覺</button>
            <button class="tab-btn" onclick="switchTab('tab-text')">純文字輸出</button>
        </div>

        <div id="tab-outer" class="preview-content active">
            <div class="outer-tablet">
                <div style="width:100%; display:flex; flex-direction:column; align-items:center;">
                    <div class="tanghao" id="prev-tanghao">川穎</div>
                    <div class="tablet-body">
                        <div class="col-right" id="prev-year">歲次甲辰年立</div>
                        <div class="col-middle" id="prev-outermiddle">堂上陳姓歷代祖考妣之神位</div>
                        <div class="col-left" id="prev-worship">陽上子孫奉祀</div>
                    </div>
                </div>
            </div>
        </div>

        <div id="tab-inner" class="preview-content">
            <div class="inner-tablet" id="prev-inner-container">
                </div>
        </div>

        <div id="tab-text" class="preview-content" style="flex-direction: column;">
            <textarea id="text-output" readonly></textarea>
            <button class="btn-copy" onclick="copyText()">複製全文至剪貼簿</button>
        </div>
    </div>
</div>

<script>
    // 防 XSS 轉義
    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, function(tag) {
            const charsToReplace = {
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            };
            return charsToReplace[tag] || tag;
        });
    }

    // 計算生老病死苦 (字數除以5: 1生, 2老, 3病, 4死, 0苦)
    function getFortune(text) {
        const cleanStr = text.replace(/[\s\p{P}]/gu, '');
        const len = cleanStr.length;
        if (len === 0) return '';
        const fortunes = ['苦', '生', '老', '病', '死'];
        const result = fortunes[len % 5];
        return `${len}字(${result})`;
    }

    function updateFortuneLabel(elementId, text, targetFortunes) {
        const el = document.getElementById(elementId);
        const fortuneStr = getFortune(text);
        el.textContent = fortuneStr;
        // 允許目標吉數為陣列 (例如中行通常為老，左右為生)
        const isLucky = targetFortunes.some(target => fortuneStr.includes(target));
        el.style.color = isLucky ? '#4CAF50' : '#d32f2f';
    }

    // 內牌預設資料
    const defaultInnerData = {
        single: [
            { title: "個人", name: "陳文華", main: "顯考陳公諱文華官一位神位", birth: "生於民國三十年二月十五日受生", death: "卒于民國一一二年八月十日別逝" }
        ],
        couple: [
            { title: "夫", name: "陳仁德", main: "顯考陳公諱仁德官一位神位", birth: "生於民國二十五年三月十日受生", death: "卒于民國一一〇年五月五日別逝" },
            { title: "妻", name: "陳李淑真", main: "顯妣陳門李氏淑真娘之神位", birth: "生於民國二十八年四月十二日受生", death: "卒于民國一一一年十月二日別逝" }
        ],
        trio: [
            { title: "中(主)", name: "陳仁德", main: "顯考陳公諱仁德官一位神位", birth: "生於民國二十五年三月十日受生", death: "卒于民國一一〇年五月五日別逝" },
            { title: "右", name: "陳李淑真", main: "顯妣陳門李氏淑真娘之神位", birth: "生於民國二十八年四月十二日受生", death: "卒于民國一一一年十月二日別逝" },
            { title: "左", name: "陳王春嬌", main: "顯妣陳門王氏春嬌娘之神位", birth: "生於民國三十年一月一日受生", death: "卒于民國一〇五年六月六日別逝" }
        ]
    };

    let currentInnerData = [];

    // 初始化
    function init() {
        document.getElementById('outerType').addEventListener('change', handleOuterTypeChange);
        document.getElementById('surname').addEventListener('input', handleOuterTypeChange);
        
        const inputs = document.querySelectorAll('.settings-panel input');
        inputs.forEach(input => input.addEventListener('input', updateAll));

        document.getElementById('innerType').addEventListener('change', (e) => {
            renderInnerForms(e.target.value);
            updateAll();
        });

        renderInnerForms('single');
        updateAll();
    }

    // 處理外牌中央主文自動產生
    function handleOuterTypeChange() {
        const type = document.getElementById('outerType').value;
        const surname = document.getElementById('surname').value || '〇';
        const middleInput = document.getElementById('outerMiddle');
        
        if (type === 'ancestor') {
            middleInput.value = `堂上${surname}姓歷代祖考妣之神位`;
        } else if (type === 'male') {
            middleInput.value = `顯考${surname}公諱〇〇官一位神位`;
        } else if (type === 'female') {
            middleInput.value = `顯妣${surname}門〇氏〇〇娘之神位`;
        }
        updateAll();
    }

    // 渲染內牌輸入表單
    function renderInnerForms(type) {
        const container = document.getElementById('inner-forms-container');
        container.innerHTML = '';
        currentInnerData = defaultInnerData[type];

        currentInnerData.forEach((person, index) => {
            const html = `
                <div class="inner-person-block">
                    <h4 style="margin-top:0; color:#cc0000; border-bottom:1px solid #ddd; padding-bottom:5px;">${person.title}</h4>
                    <div class="form-group">
                        <label>姓名</label>
                        <input type="text" id="inner-name-${index}" value="${person.name}" oninput="updateAll()">
                    </div>
                    <div class="form-group">
                        <label>內牌主文 (中央) <span class="fortune-tag" id="ft-inner-main-${index}"></span></label>
                        <input type="text" id="inner-main-${index}" value="${person.main}" oninput="updateAll()">
                    </div>
                    <div class="form-group">
                        <label>生日 (右行) <span class="fortune-tag" id="ft-inner-birth-${index}"></span></label>
                        <input type="text" id="inner-birth-${index}" value="${person.birth}" oninput="updateAll()">
                    </div>
                    <div class="form-group">
                        <label>忌日 (左行) <span class="fortune-tag" id="ft-inner-death-${index}"></span></label>
                        <input type="text" id="inner-death-${index}" value="${person.death}" oninput="updateAll()">
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
        });
    }

    // 統一更新預覽與純文字
    function updateAll() {
        const tabletId = escapeHTML(document.getElementById('tabletId').value);
        const entryDate = escapeHTML(document.getElementById('entryDate').value);

        // 外牌資料
        const tanghaoOrig = escapeHTML(document.getElementById('tanghao').value);
        // 堂號視覺強制左右置換 (例: 穎川 -> 川穎)
        const tanghaoReversed = tanghaoOrig.split('').reverse().join('');
        
        const year = escapeHTML(document.getElementById('year').value);
        const outerMiddle = escapeHTML(document.getElementById('outerMiddle').value);
        const worship = escapeHTML(document.getElementById('worship').value);

        // 更新外牌吉凶
        updateFortuneLabel('ft-tanghao', tanghaoOrig, ['老']); 
        updateFortuneLabel('ft-year', year, ['生']);       
        updateFortuneLabel('ft-outermiddle', outerMiddle, ['老']); 
        updateFortuneLabel('ft-worship', worship, ['生']); 

        // 更新外牌視覺
        document.getElementById('prev-tanghao').innerHTML = tanghaoReversed;
        document.getElementById('prev-year').innerHTML = year;
        document.getElementById('prev-outermiddle').innerHTML = outerMiddle;
        document.getElementById('prev-worship').innerHTML = worship;

        // 內牌資料處理
        const innerContainer = document.getElementById('prev-inner-container');
        innerContainer.innerHTML = '';
        let textOutputInner = '';

        currentInnerData.forEach((_, index) => {
            const main = escapeHTML(document.getElementById(`inner-main-${index}`).value);
            // 強制確保前綴字
            let birth = escapeHTML(document.getElementById(`inner-birth-${index}`).value);
            let death = escapeHTML(document.getElementById(`inner-death-${index}`).value);

            if(!birth.startsWith('生於') && birth.trim() !== '') birth = '生於' + birth.replace(/^生[於于]/, '');
            if(!death.startsWith('卒于') && death.trim() !== '') death = '卒于' + death.replace(/^卒[於于]/, '');

            // 內牌吉凶驗算
            updateFortuneLabel(`ft-inner-main-${index}`, main, ['老', '生']);
            updateFortuneLabel(`ft-inner-birth-${index}`, birth, ['老', '生']);
            updateFortuneLabel(`ft-inner-death-${index}`, death, ['老', '生']);

            // 視覺組裝 (右至左：生日、主文、忌日)
            const personHtml = `
                <div class="inner-person-col">
                    <div class="inner-side">${birth}</div>
                    <div class="inner-main">${main}</div>
                    <div class="inner-side">${death}</div>
                </div>
            `;
            innerContainer.insertAdjacentHTML('afterbegin', personHtml); 

            // 文字組裝
            const name = escapeHTML(document.getElementById(`inner-name-${index}`).value);
            textOutputInner += `\n【內牌 - ${name}】\n`;
            textOutputInner += `第一行(右)：${birth}\n`;
            textOutputInner += `中間行：${main}\n`;
            textOutputInner += `第三行(左)：${death}\n`;
        });

        // 總合純文字輸出
        const textOutput = `牌位編號：${tabletId}\n入牌日期：${entryDate}\n\n` +
                           `【外牌】\n` +
                           `頂部(橫排)：${tanghaoOrig}\n` +
                           `第一行(右)：${year}\n` +
                           `中間行：${outerMiddle}\n` +
                           `第三行(左)：${worship}\n` +
                           `${textOutputInner}`;
        
        document.getElementById('text-output').value = textOutput;
    }

    // 頁籤切換
    function switchTab(tabId) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.preview-content').forEach(content => content.classList.remove('active'));
        
        event.target.classList.add('active');
        document.getElementById(tabId).classList.add('active');
    }

    // 複製純文字
    function copyText() {
        const text = document.getElementById('text-output');
        text.select();
        text.setSelectionRange(0, 99999); 
        navigator.clipboard.writeText(text.value).then(() => {
            alert("已成功複製牌位純文字內容！");
        }).catch(err => {
            alert("複製失敗，請手動選取後複製。");
        });
    }

    window.onload = init;
</script>

</body>
</html>
